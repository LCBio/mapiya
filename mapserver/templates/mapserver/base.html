{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Mapserver</title>

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon.ico' %}"/>

    {% block css %}
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="{% static 'vendors/bootstrap-4.4.1-dist/css/bootstrap.min.css' %}">
        <!-- Fontawesome -->
        <link rel="stylesheet" href="{% static 'vendors/fontawesome-free-5.13.0-web/css/all.min.css' %}">
        <!-- Mapserver CSS -->
        <link rel="stylesheet" href="{% static 'css/mapserver.css' %}">
    {% endblock css %}

</head>

<body>
    {% block topnav %}{% include 'mapserver/topnav.html' %}{% endblock topnav %}
    <div class="container-fluid" id="content-container">
            {% block content %}{% endblock content %}
    </div>
    {% include 'mapserver/footer.html' %}
    {% block js %}
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <!-- Bootstrap -->
        <script src="{% static 'vendors/bootstrap-4.4.1-dist/js/bootstrap.bundle.min.js' %}"></script>
        <!-- Mapserver -->
        <script src="{% static 'js/mapserver.js' %}"></script>
    {% endblock %}

</body>
</html>
