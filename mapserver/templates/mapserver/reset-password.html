{% extends 'mapserver/base.html' %}

{% block topnav %}{% endblock %}
{% block content %}
    <div class="col-sm-10 offset-sm-1 col-md-8 offset-md-2 col-lg-6 offset-lg-3 col-xl-4 offset-xl-4">
        <div class="card shadow">
            <div class="card-header text-center bg-primary text-white font-weight-bold">
                Reset password
            </div>
            <div class="card-body text-center px-5 pt-4 pb-3">
                {% if form %}
                    <form method="post" action="{% url 'password-reset' %}" novalidate>
                        {% csrf_token %}

                        <input type="email" name="email" placeholder="Enter email" required
                               class="form-control my-1 {% if form.errors.email %}is-invalid{% endif %}"/>
                        {% for error in form.errors.email %}
                            <small class="invalid-feedback">{{ error }}</small>
                        {% endfor %}
                        <button type="submit" class="btn btn-primary btn-block my-3">Submit</button>
                    </form>
                {% else %}
                    <h6 class="text-success">Link to password reset was send to: {{ email }}</h6>
                {% endif %}
                <a href="{% url 'login' %}">Back to login</a>
            </div>
        </div>
    </div>
{% endblock %}
