<div class="modal-header bg-danger text-white">
    <h6 class="modal-title">Deleting {{ object }}</h6>
    <button type="button" class="close" data-dismiss="modal" >
        <i class="fas fa-times-circle text-white"></i>
    </button>
</div>
<div class="modal-body">
    <h5>Are you sure you want to delete <strong>{{ object }}</strong>?</h5>
    <small class="text-danger font-weight-bold">This cannot be undone.</small>
</div>
<form action="{% url 'map-delete' object.pk %}" method="post">
    {% csrf_token %}
    <div class="modal-footer">
        <button class="btn btn-sm btn-danger mr-auto" type="submit">Delete</button>
        <button class="btn btn-sm btn-secondary" type="button" data-dismiss="modal">Back</button>
    </div>
</form>
