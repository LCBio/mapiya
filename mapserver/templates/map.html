{% extends 'base.html' %}
{% load static %}
{% load django_tables2 %}

{% block css %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/pdbe-molstar-light-1.2.0.css' %}">
    <link rel="stylesheet" href="{% static 'css/mapview.css' %}">
{% endblock css %}

{% block content %}

    <div class="content-wrapper">
        <div class="plotly-app">
            {% load plotly_dash %}
            {% plotly_app name="ContactMap" initial_arguments=plotly %}
        </div>

        <div id="molStarViewport"></div>
    </div>

{% endblock content %}

{% block js %}
    {{ block.super }}

    <!-- Molstar -->
    <script src="{% static 'js/pdbe-molstar-plugin-1.2.0.js' %}"></script>
    <script src="{% static 'js/molstar.js' %}"></script>
    <script>
        let viewerInstance = initMolStarViewer('{{ object.molstar_url }}', 'molStarViewport');
        window.addEventListener('storage', () => {updateMolStarViewer(viewerInstance);});
    </script>
{% endblock js %}
