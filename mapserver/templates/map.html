{% extends 'base.html' %}
{% load static %}
{% load django_tables2 %}

{% block css %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/pdbe-molstar-light-1.2.0.css' %}">
    <link rel="stylesheet" href="{% static 'css/mapview.css' %}">
{% endblock css %}

{% block content %}

    <div class="content-wrapper">
        <div class="plotly-app">
            {% load plotly_dash %}
            {% plotly_app name="ContactMap" initial_arguments=plotly %}
        </div>

        <div id="molStarViewport"></div>
        <div id="Electrostatics">
            <button onclick="colorbyPQR('{{object.pk}}',viewerInstance)" style="float: right;">Electrostatics</
        </div>
    </div>

{% endblock content %}

{% block js %}
    {{ block.super }}

    <!-- Molstar -->
    <script src="{% static 'js/pdbe-molstar-plugin-1.2.0.js' %}"></script>
    <script src="{% static 'js/molstar.js' %}"></script>
    <script>
        let viewerInstance = initMolStarViewer('molStarViewport', '{{object.pk}}');
        viewerInstance.events.loadComplete.subscribe(() => 
        {
            add_representations(viewerInstance, 'gaussian-surface', 0.15);
        }
        );
        window.addEventListener('storage', () => 
        {
            LoadCurrentModel('{{object.pk}}',viewerInstance);
        }
        );
    </script>
{% endblock js %}
