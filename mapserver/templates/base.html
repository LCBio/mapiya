{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>{% if title %}{{ title }}{% else %}Title{% endif %}</title>

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon.ico' %}"/>

    {% block css %}
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="{% static 'vendors/bootstrap-4.4.1-dist/css/bootstrap.min.css' %}">
        <!-- Fontawesome -->
        <link rel="stylesheet" href="{% static 'vendors/fontawesome-free-5.13.0-web/css/all.min.css' %}">
        <!-- Mapserver -->
        <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% endblock css %}

</head>

<body>
    {% block topnav %}{% include 'topnav.html' %}{% endblock topnav %}
    <div class="container-fluid content-container">{% block content %}{% endblock content %}</div>
    {% include 'footer.html' %}
    {% block js %}
        <!-- jQuery -->
        <script src="{% static 'js/jquery-3.5.1.min.js' %}"></script>
        <!-- Bootstrap -->
        <script src="{% static 'vendors/bootstrap-4.4.1-dist/js/bootstrap.bundle.min.js' %}"></script>
        <!-- Mapserver -->
        <script src="{% static 'js/main.js' %}"></script>
    {% endblock %}
</body>
</html>
